<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Racing Viewer</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

    body {
      font-family: 'Noto Sans JP', sans-serif;
      /* 背景を完全な白ではなく、ごく薄いグレーにして奥行きを出す */
      background-color: #F8FAFC; 
      color: #1e293b;
    }

    .btn-icon {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .btn-icon:hover { transform: translateY(-1px); filter: brightness(0.95); }
    .btn-icon:active { transform: translateY(0); }

    .rank-badge {
      min-width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px; /* 丸から少し四角くモダンに */
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0 6px;
      line-height: 1;
      user-select: none;
      border: 1px solid transparent;
    }
    /* 着順の色を「薄い背景+濃い文字」の上品なスタイルに */
    .rank-1 { background-color: #FEF3C7; color: #92400E; border-color: #FDE68A; }
    .rank-2 { background-color: #F1F5F9; color: #334155; border-color: #E2E8F0; }
    .rank-3 { background-color: #FFEDD5; color: #9A3412; border-color: #FED7AA; }
    .rank-other { background-color: transparent; color: #94a3b8; border-color: #E2E8F0; }

    input:focus {
      outline: none;
      border-color: #6366f1; /* インディゴ系で知的に */
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .momentum-scroll { -webkit-overflow-scrolling: touch; }
  
    /* ブランドカラー定義 */
    .btn-netkeiba { background-color: #3850B0; color: #ffffff; border: 1px solid #3850B0; }
    /* レース再生ボタンは視認性重視で濃いダークグレー */
    .btn-race-hd { background-color: #1e293b; color: #ffffff; border: 1px solid #1e293b; } 
    /* SDやサブボタンは白背景＋枠線 */
    .btn-race-sd { background-color: #ffffff; color: #475569; border: 1px solid #e2e8f0; }

</style>
</head>

<body class="min-h-screen selection:bg-indigo-100 selection:text-indigo-900">

  <div id="loadingOverlay" class="fixed inset-0 z-[60] flex items-center justify-center bg-white/90 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-4">
      <div class="relative">
        <div class="w-12 h-12 rounded-full border-4 border-slate-100 border-t-indigo-600 animate-spin"></div>
      </div>
      <div class="text-center">
        <div id="loadingText" class="text-sm font-bold text-slate-700">データ読み込み中…</div>
        <div class="text-xs text-slate-400 mt-1">（初回は少し時間かかることがあるよ）</div>
      </div>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-4 md:px-8 pt-6 pb-28">

    <div id="listSection">
      <div class="flex items-center justify-between mb-4 px-1">
        <div id="listHint" class="text-xs font-medium text-slate-500"></div>
        <button id="scrollTopBtn" class="hidden text-xs font-medium text-indigo-600 hover:text-indigo-800 transition-colors py-1 px-2 rounded hover:bg-indigo-50" type="button">
          <i class="fas fa-arrow-up mr-1"></i>先頭へ
        </button>
      </div>

      <div id="raceList" class="space-y-4"></div>

      <div id="moreWrap" class="hidden pt-6 pb-12 flex items-center justify-center gap-3">
        <button id="moreBtn"
          class="bg-white border border-slate-200 shadow-sm rounded-full px-6 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-800 hover:border-slate-300 transition-all active:scale-95"
          type="button"
        >
          もっと見る
        </button>
        <button id="allBtn"
          class="text-xs text-slate-400 hover:text-slate-600 underline underline-offset-4 decoration-slate-300 px-2"
          type="button"
        >
          全件表示
        </button>
        <div id="shownCount" class="text-xs text-slate-400 ml-1"></div>
      </div>

      <div id="emptyState" class="text-center py-20 hidden">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
          <i class="fas fa-search text-2xl"></i>
        </div>
        <p class="text-slate-600 font-medium">条件に合うレースが見つかりません</p>
        <p class="text-xs text-slate-400 mt-2">検索条件を変更してみてください</p>
      </div>
    
      <div aria-hidden="true" style="height: calc(96px + env(safe-area-inset-bottom));"></div>
    </div>
  </main>

  <div id="horsePickerModal" class="fixed inset-0 z-40 hidden" aria-hidden="true">
    <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-[2px] transition-opacity" id="horsePickerBackdrop"></div>

    <div class="absolute inset-x-0 bottom-0">
      <div class="max-w-4xl mx-auto px-0 md:px-8">
        <div class="bg-white rounded-t-2xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] max-h-[85vh] flex flex-col relative overflow-hidden">
          
          <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white z-10 sticky top-0">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600">
                <i class="fas fa-horse text-sm"></i>
              </div>
              <span class="font-bold text-slate-800">馬を選ぶ</span>
            </div>
            <button class="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors" type="button" id="closeHorsePickerBtn" aria-label="閉じる">
              <i class="fas fa-xmark text-lg"></i>
            </button>
          </div>

          <div id="horsePickerScroll" class="px-5 py-6 overflow-y-auto overscroll-contain momentum-scroll bg-[#F8FAFC]" style="padding-bottom: calc(32px + env(safe-area-inset-bottom));">
            <div id="horsePicker" class="space-y-8"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================
    // Settings
    // ==========================
    const DEFAULT_LIMIT = 50;
    const MORE_STEP = 100;
    const SEARCH_DEBOUNCE_MS = 220;

    const PLACE_MAP = {
      '01': '札幌', '02': '函館', '03': '福島', '04': '新潟', '05': '東京',
      '06': '中山', '07': '中京', '08': '京都', '09': '阪神', '10': '小倉'
    };

    // ==========================
    // State
    // ==========================
    let horsesData = [];
    let rawData = [];

    let racesSorted = [];
    let selectedHorseName = null;
    let showStarOnly = false;

    let horsePickerOpen = false;
    let horsePickerBuilt = false;

    let displayLimit = DEFAULT_LIMIT;
    let lastFilterKey = '';

    let isComposing = false;
    let searchTimer = null;

    // ==========================
    // Helpers
    // ==========================
    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function showLoading(show, text) {
      const overlay = document.getElementById('loadingOverlay');
      const textEl = document.getElementById('loadingText');
      if (!overlay) return;
      if (typeof text === 'string' && textEl) textEl.textContent = text;
      overlay.classList.toggle('hidden', !show);
    }

    function getFetchCacheMode() {
      const isLocal = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
      return isLocal ? 'no-store' : 'force-cache';
    }

    function parseNetkeibaID(fullId) {
      if (!fullId) return { isForeign: true };
      const s = String(fullId);
      if (/^\d{12}$/.test(s)) {
        return {
          isForeign: false,
          year: s.substring(0, 4),
          place: s.substring(4, 6),
          kai: s.substring(6, 8),
          day: s.substring(8, 10),
          race: s.substring(10, 12)
        };
      }
      return { isForeign: true, rawId: s };
    }

    function getNetkeibaRaceUrl(raceId) {
      return `https://db.netkeiba.com/race/${raceId}/`;
    }

    function isGradedRace(raceName) {
      const s = (raceName || '');
      return /(\bGI\b|\bGII\b|\bGIII\b|\bG1\b|\bG2\b|\bG3\b|JpnI|JpnII|JpnIII|重賞)/i.test(s);
    }

    function yyyymmFromDate(dateStr) {
      const m = /^(\d{4})-(\d{2})/.exec(dateStr || '');
      if (!m) return null;
      return parseInt(m[1] + m[2], 10);
    }

    function getQualityProfile(dateStr, raceName) {
      const ym = yyyymmFromDate(dateStr);
      const graded = isGradedRace(raceName);

      const profile = {
        graded,
        race:    { hd: null, sd: 2 },
        paddock: { hd: null, sd: null },
        time:    { hd: null },
        multi:   { hd: null },
        patrol:  { hd: null, sd: null }
      };

      if (!ym) return profile;

      if (ym < 201401) return profile;

      if (ym >= 201401 && ym < 201501) {
        profile.paddock.sd = 1;
        return profile;
      }
      if (ym >= 201501 && ym < 201701) {
        profile.paddock.sd = 1;
        if (graded) {
          profile.multi.hd = 1;
          profile.patrol.hd = 2;
        }
        return profile;
      }
      if (ym >= 201701 && ym < 202010) {
        profile.paddock.sd = 1;
        profile.race.hd = graded ? 5 : 4;
        profile.race.sd = 2;
        if (graded) {
          profile.multi.hd = 4;
          profile.patrol.hd = 5;
        }
        return profile;
      }
      if (ym >= 202010 && ym < 202210) {
        profile.paddock.hd = 4;
        profile.paddock.sd = 1;
        profile.race.hd = 5;
        profile.race.sd = 2;
        profile.multi.hd = 4;
        profile.patrol.hd = 5;
        return profile;
      }
      if (ym >= 202210) {
        profile.paddock.hd = 4;
        profile.paddock.sd = 1;
        profile.race.hd = 5;
        profile.race.sd = 2;
        profile.time.hd = 5;
        profile.multi.hd = 4;
        profile.patrol.hd = 5;
        return profile;
      }
      return profile;
    }

    function buildViewerUrl(parsed, dateStr, kind, quality) {
      if (!parsed || parsed.isForeign || !quality) return null;

      const dateClean = (dateStr || '').replace(/-/g, '');
      const ym = yyyymmFromDate(dateStr) || 0;
      const yy = parsed.year.substring(2, 4);
      const p = parseInt(parsed.place, 10).toString();

      const kNum = parseInt(parsed.kai, 10);
      const k = (kNum >= 10) ? kNum.toString(16) : kNum.toString();

      const dNum = parseInt(parsed.day, 10);
      const d = (dNum >= 10) ? dNum.toString(16) : dNum.toString();

      const rNum = parseInt(parsed.race, 10);
      const rCode = (rNum >= 10) ? rNum.toString(16) : rNum.toString();

      const viewerId = `${yy}${p}${k}${d}${rCode}`;
      const baseUrl = (kind === "multi" && ym < 201701)
        ? "https://regist.prc.jp/api/windowopen.aspx?target=multi_all"
        : "https://regist.prc.jp/api/windowopen.aspx?target=race";
      const yearPath = parsed.year;

      const base = `${baseUrl}/${yearPath}/${dateClean}/${viewerId}`;

      if (kind === 'race') return `${base}&quality=${quality}&view=0`;
      if (kind === 'time') return `${base}_t&quality=${quality}`;
      if (kind === 'paddock') return `${base}_p&quality=${quality}`;
      if (kind === 'multi') return `${base}_m&quality=${quality}`;
      if (kind === 'patrol') return `${base}&quality=${quality}&view=1`;
      return null;
    }

    function normalizeRank(rank) {
      if (typeof rank === 'number' && Number.isFinite(rank)) return { kind: 'num', n: rank };
      if (typeof rank === 'string') {
        const t = rank.trim();
        if (/^\d+$/.test(t)) return { kind: 'num', n: parseInt(t, 10) };
        if (t.length > 0) return { kind: 'text', text: t };
      }
      return { kind: 'none' };
    }

    function getRankClass(n) {
      if (n === 1) return 'rank-1';
      if (n === 2) return 'rank-2';
      if (n === 3) return 'rank-3';
      return 'rank-other';
    }

    function getBirthYearFromHorse(h) {
      const id = (h && typeof h.horseId === 'string') ? h.horseId : '';
      if (id.length < 4) return null;
      const y = parseInt(id.slice(0, 4), 10);
      return Number.isFinite(y) ? y : null;
    }

    function getFilterKey(searchVal) {
      return `${selectedHorseName ?? ''}|${showStarOnly ? 1 : 0}|${searchVal}`;
    }

    // ==========================
    // UI Updates
    // ==========================
    function updateStarToggleUI() {
      const btn = document.getElementById('starToggleBtn');
      const icon = document.getElementById('starToggleIcon');
      if (!btn || !icon) return;

      if (showStarOnly) {
        btn.setAttribute('aria-pressed', 'true');
        btn.classList.add('bg-yellow-50', 'text-yellow-500', 'border-yellow-200');
        btn.classList.remove('bg-white', 'text-slate-400', 'border-slate-200');
        icon.classList.remove('far');
        icon.classList.add('fas');
      } else {
        btn.setAttribute('aria-pressed', 'false');
        btn.classList.add('bg-white', 'text-slate-400', 'border-slate-200');
        btn.classList.remove('bg-yellow-50', 'text-yellow-500', 'border-yellow-200');
        icon.classList.remove('fas');
        icon.classList.add('far');
      }
    }

    function updateSelectedHorseUI() {
      const badge = document.getElementById('selectedHorseBadge');
      const nameEl = document.getElementById('selectedHorseName');
      const clearBtn = document.getElementById('clearHorseBtn');

      if (!badge || !nameEl || !clearBtn) return;

      if (selectedHorseName) {
        badge.classList.remove('hidden');
        badge.classList.add('inline-flex');
        clearBtn.classList.remove('hidden');
        nameEl.textContent = selectedHorseName;
      } else {
        badge.classList.add('hidden');
        badge.classList.remove('inline-flex');
        clearBtn.classList.add('hidden');
        nameEl.textContent = '';
      }
    }

    function openHorsePicker() {
      horsePickerOpen = true;
      if (!horsePickerBuilt) {
        buildHorsePicker();
        horsePickerBuilt = true;
      }
      updateHorsePickerUI();
    }

    function closeHorsePicker() {
      horsePickerOpen = false;
      updateHorsePickerUI();
    }

    function updateHorsePickerUI() {
      const modal = document.getElementById('horsePickerModal');
      const chev = document.getElementById('horsePickerChevron');
      const btn = document.getElementById('toggleHorsePickerBtn');
      const listSection = document.getElementById('listSection');
      const footer = document.getElementById('appFooter');

      btn?.setAttribute('aria-expanded', horsePickerOpen ? 'true' : 'false');

      if (horsePickerOpen) {
        modal?.classList.remove('hidden');
        modal?.setAttribute('aria-hidden', 'false');
        // 背景スクロールロック
        document.body.classList.add('overflow-hidden');
        chev?.classList.remove('fa-chevron-up');
        chev?.classList.add('fa-chevron-down');
      } else {
        modal?.classList.add('hidden');
        modal?.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('overflow-hidden');
        chev?.classList.remove('fa-chevron-down');
        chev?.classList.add('fa-chevron-up');
      }
    }

    function clearHorseFilter() {
      selectedHorseName = null;
      updateSelectedHorseUI();
      scheduleRender(true);
    }

    function setHorseFilterByName(name) {
      selectedHorseName = name || null;
      updateSelectedHorseUI();
      closeHorsePicker();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      scheduleRender(true);
    }

    // ==========================
    // Debounced render + IME
    // ==========================
    function scheduleRender(forceImmediate = false) {
      if (horsePickerOpen) return;

      if (forceImmediate) {
        clearTimeout(searchTimer);
        renderList();
        return;
      }

      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        if (isComposing) return;
        renderList();
      }, SEARCH_DEBOUNCE_MS);
    }

    // ==========================
    // Horse Picker (lazy build)
    // ==========================
    function buildHorsePicker() {
      const pickerEl = document.getElementById('horsePicker');
      if (!pickerEl) return;

      const groups = new Map();
      for (const h of (horsesData || [])) {
        const y = getBirthYearFromHorse(h);
        const key = (y === null) ? '不明' : String(y);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(h);
      }

      const years = Array.from(groups.keys()).sort((a, b) => {
        if (a === '不明') return 1;
        if (b === '不明') return -1;
        return parseInt(b, 10) - parseInt(a, 10);
      });

      pickerEl.innerHTML = '';

      for (const y of years) {
        const hs = groups.get(y) || [];
        hs.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));

        const section = document.createElement('section');
        section.className = 'bg-white rounded-xl p-4 shadow-sm border border-slate-100';

        const title = document.createElement('div');
        title.className = 'flex items-baseline justify-between mb-3';
        title.innerHTML = `
          <div class="text-sm font-bold text-slate-700">
            ${escapeHtml(y)}<span class="text-xs font-normal text-slate-400 ml-1">年生まれ</span>
          </div>
          <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">${hs.length}</span>
        `;

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 sm:grid-cols-3 gap-2';

        for (const h of hs) {
          const btn = document.createElement('button');
          btn.type = 'button';
          // カード風ボタンに
          btn.className = 'bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm text-slate-700 hover:border-indigo-300 hover:text-indigo-700 hover:shadow-sm transition-all text-left min-h-[44px] truncate';
          btn.textContent = h.name || '';
          btn.addEventListener('click', () => setHorseFilterByName(h.name || ''));
          grid.appendChild(btn);
        }

        section.appendChild(title);
        section.appendChild(grid);
        pickerEl.appendChild(section);
      }
    }

    // ==========================
    // Render
    // ==========================
    function renderList() {
      const listEl = document.getElementById('raceList');
      const emptyEl = document.getElementById('emptyState');
      const moreWrap = document.getElementById('moreWrap');
      const shownCount = document.getElementById('shownCount');
      const listHint = document.getElementById('listHint');
      const scrollTopBtn = document.getElementById('scrollTopBtn');

      if (!listEl || !emptyEl) return;

      const searchInput = document.getElementById('searchInput');
      const searchVal = (searchInput?.value || '').toLowerCase().trim();

      const isDefaultView = !selectedHorseName && !showStarOnly && !searchVal;

      const filterKey = getFilterKey(searchVal);
      if (filterKey !== lastFilterKey) {
        lastFilterKey = filterKey;
        displayLimit = DEFAULT_LIMIT;
      }

      if (listHint) {
        if (isDefaultView) {
          listHint.textContent = `最新のレース`;
        } else {
          const parts = [];
          if (selectedHorseName) parts.push(`${selectedHorseName}`);
          if (searchVal) parts.push(`"${searchVal}"`);
          if (showStarOnly) parts.push('お気に入り');
          listHint.innerHTML = parts.join(' <span class="text-slate-300 mx-1">/</span> ') || '';
        }
      }

      if (scrollTopBtn) {
        const show = window.scrollY > 600;
        scrollTopBtn.classList.toggle('hidden', !show);
      }

      listEl.innerHTML = '';
      emptyEl.classList.add('hidden');

      let total = 0;
      let visible = [];

      if (isDefaultView) {
        total = racesSorted.length;
        const lim = (displayLimit === Infinity) ? total : Math.min(displayLimit, total);
        visible = racesSorted.slice(0, lim);
      } else {
        const keywords = searchVal ? searchVal.split(/\s+/).filter(Boolean) : [];

        const filtered = [];
        for (const race of racesSorted) {
          if (selectedHorseName && race.horseName !== selectedHorseName) continue;
          if (showStarOnly && race.star !== true) continue;

          if (keywords.length) {
            let ok = true;
            const t = race.searchText || '';
            for (const k of keywords) {
              if (!t.includes(k)) { ok = false; break; }
            }
            if (!ok) continue;
          }

          filtered.push(race);
        }

        total = filtered.length;
        visible = filtered;
      }

      if (total === 0) {
        emptyEl.classList.remove('hidden');
        moreWrap?.classList.add('hidden');
        if (shownCount) shownCount.textContent = '';
        return;
      }

      if (isDefaultView && total > visible.length) {
        moreWrap?.classList.remove('hidden');
        if (shownCount) shownCount.textContent = `${visible.length} / ${total}件`;
      } else {
        moreWrap?.classList.add('hidden');
        if (shownCount) shownCount.textContent = '';
      }

      const showHorseLabelInRows = (selectedHorseName === null);
      const frag = document.createDocumentFragment();

      for (const race of visible) {
        const parsed = race.parsed;

        const isForeign = parsed && parsed.isForeign;
        const placeName = (!isForeign && parsed) ? (PLACE_MAP[parsed.place] || '') : '海外';
        const rNum = (!isForeign && parsed) ? (parseInt(parsed.race, 10) + 'R') : '';

        // 馬名チップ：タグ風にモダン化
        const horseChipHtml = showHorseLabelInRows
          ? `<button type="button"
                class="horse-chip ml-2 text-[10px] px-2 py-0.5 rounded border border-slate-200 bg-slate-50 text-slate-500 hover:border-indigo-300 hover:text-indigo-600 hover:bg-white transition-colors"
                data-horse="${escapeHtml(race.horseName)}">${escapeHtml(race.horseName)}</button>`
          : '';

        const netkeibaUrl = (/^\d{12}$/.test(String(race.id))) ? getNetkeibaRaceUrl(String(race.id)) : null;

        const row = document.createElement('div');
        // カードデザイン: 浮き上がりシャドウを少し強めに
        row.className = "bg-white rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.04)] hover:shadow-md transition-shadow gap-4";
        
        const profile = getQualityProfile(race.date, race.raceName);

        function btnHtml(href, title, classes, innerHtml, disabled, dim) {
          // ボタン共通クラス
          const baseCls = `btn-icon rounded-md ${classes} ${dim ? 'opacity-50' : ''} ${disabled ? 'opacity-30 pointer-events-none' : ''}`;
          if (disabled || !href) {
            return `<span title="${escapeHtml(title)}" class="${baseCls}">${innerHtml}</span>`;
          }
          return `<a href="${href}" target="_blank" rel="noopener" title="${escapeHtml(title)}" class="${baseCls}">${innerHtml}</a>`;
        }

        let linksHtml = '';
        if (parsed && !parsed.isForeign) {
          const raceHdUrl = buildViewerUrl(parsed, race.date, 'race', profile.race.hd);
          const raceSdUrl = buildViewerUrl(parsed, race.date, 'race', profile.race.sd);
          const paddockHdUrl = buildViewerUrl(parsed, race.date, 'paddock', profile.paddock.hd);
          const paddockSdUrl = buildViewerUrl(parsed, race.date, 'paddock', profile.paddock.sd);
          const timeUrl = buildViewerUrl(parsed, race.date, 'time', profile.time.hd);
          const multiUrl = buildViewerUrl(parsed, race.date, 'multi', profile.multi.hd);
          const patrolUrl = buildViewerUrl(parsed, race.date, 'patrol', profile.patrol.hd);
          const netkeibaUrl = (/^\d{12}$/.test(String(race.id))) ? getNetkeibaRaceUrl(String(race.id)) : null;

          const raceSdDim = !!raceHdUrl && !!raceSdUrl;
          const padSdDim = !!paddockHdUrl && !!paddockSdUrl;

          // ボタン配色: フラットだが視認性の良い色使いに
          linksHtml = `
            <div class="flex items-center gap-2 mt-1 sm:mt-0 flex-wrap">
              ${btnHtml(netkeibaUrl, 'netkeiba', 'btn-netkeiba', '<i class="fas fa-arrow-up-right-from-square text-xs"></i>', !netkeibaUrl, false)}

              ${btnHtml(raceHdUrl, 'レース(高画質)', 'btn-race-hd shadow-sm', '<i class="fas fa-play text-xs"></i>', !raceHdUrl, false)}
              ${btnHtml(raceSdUrl, 'レース(SD)', 'btn-race-sd', '<span class="text-[10px] font-bold">SD</span>', !raceSdUrl, raceSdDim)}

              <div class="w-px h-6 bg-slate-200 mx-1 hidden sm:block"></div>

              ${btnHtml(paddockHdUrl, 'パドック', 'bg-emerald-600 text-white shadow-sm border border-emerald-600 hover:bg-emerald-700', '<i class="fas fa-horse text-xs"></i>', !paddockHdUrl, false)}
              ${btnHtml(paddockSdUrl, 'パドック(SD)', 'bg-white text-emerald-700 border border-emerald-200 hover:bg-emerald-50', '<span class="text-[10px] font-bold">SD</span>', !paddockSdUrl, padSdDim)}

              ${patrolUrl ? btnHtml(patrolUrl, 'パトロール', 'bg-slate-500 text-white hover:bg-slate-600 shadow-sm', '<i class="fas fa-video text-xs"></i>', false, false) : ''}

              ${multiUrl ? btnHtml(multiUrl, 'マルチ', 'bg-purple-600 text-white hover:bg-purple-700 shadow-sm', '<i class="fas fa-border-all text-xs"></i>', false, false) : ''}

              ${timeUrl ? btnHtml(timeUrl, '時計付', 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm', '<i class="fas fa-stopwatch text-xs"></i>', false, false) : ''}
            </div>
          `;
        } else {
          linksHtml = `
            <div class="flex items-center gap-2 mt-1 sm:mt-0 opacity-50 select-none px-2">
              <span class="text-xs text-slate-400"><i class="fas fa-ban mr-1"></i>映像なし</span>
            </div>
          `;
        }


        row.innerHTML = `
          <div class="flex-1 w-full sm:w-auto min-w-0">
            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
              <span class="text-slate-400 text-xs font-mono">${escapeHtml(race.date.replace(/-/g, '/'))}</span>
              <span class="text-slate-500 text-xs font-bold bg-slate-100 px-1.5 py-0.5 rounded">${escapeHtml(placeName)}${rNum ? escapeHtml(rNum) : ''}</span>
              ${horseChipHtml}
            </div>

            <div class="flex items-center gap-3">
              ${(() => {
                const rk = normalizeRank(race.rank);
                if (rk.kind === 'num') {
                  return `<div class="${getRankClass(rk.n)} rank-badge">
                    ${rk.n}<span class="text-[0.6rem] ml-0.5 font-normal opacity-70">着</span>
                  </div>`;
                }
                if (rk.kind === 'text') {
                  return `<div class="rank-other rank-badge border border-slate-200">${escapeHtml(rk.text)}</div>`;
                }
                return '';
              })()}
              <div class="truncate">
                <span class="text-slate-800 font-bold text-lg leading-tight tracking-tight">
                  ${escapeHtml(race.raceName)}
                  ${race.star === true ? ' <i class="fas fa-star text-yellow-400 ml-1 text-sm"></i>' : ''}
                </span>
              </div>
            </div>
          </div>
          ${linksHtml}
        `;

        const chip = row.querySelector('.horse-chip');
        if (chip) {
          chip.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            setHorseFilterByName(race.horseName);
          });
        }

        frag.appendChild(row);
      }

      listEl.appendChild(frag);
    }

    // ==========================
    // Data load
    // ==========================
    async function loadData() {
      try {
        showLoading(true, 'データ読み込み中…');

        const res = await fetch('horsesData.json', { cache: getFetchCacheMode() });
        if (!res.ok) throw new Error(`Failed to load horsesData.json: ${res.status}`);

        const horses = await res.json();
        horsesData = Array.isArray(horses) ? horses : (horses && Array.isArray(horses.horses) ? horses.horses : []);

        rawData = (horsesData || []).flatMap(h => {
          const horseName = h.name;
          const rs = Array.isArray(h.races) ? h.races : [];
          return rs.map(r => ({
            id: r.id ?? r.raceId ?? r.raceID,
            date: r.date,
            raceName: r.raceName,
            horseName,
            rank: r.rank,
            ...(r.star === true ? { star: true } : {})
          }));
        }).filter(r => r.id && r.date && r.raceName && r.horseName);

        init();
      } catch (e) {
        console.error(e);
        showLoading(false);
        const emptyEl = document.getElementById('emptyState');
        if (emptyEl) {
          emptyEl.classList.remove('hidden');
          emptyEl.innerHTML = `
            <div class="text-slate-400 text-4xl mb-2"><i class="fas fa-triangle-exclamation"></i></div>
            <p class="text-sm text-slate-600">データの読み込みに失敗しました</p>
            <p class="text-xs mt-2 text-slate-400">
              ローカル環境の場合はWebサーバー経由で開いてください
            </p>`;
        }
      }
    }

    function init() {
      showLoading(true, '一覧を準備中…');

      const tmp = rawData.map(item => {
        const parsed = parseNetkeibaID(item.id);
        const placeName = (!parsed.isForeign) ? (PLACE_MAP[parsed.place] || '') : '海外';
        const searchText = `${item.date} ${item.raceName || ''} ${item.horseName || ''} ${placeName}`.toLowerCase();
        return { ...item, parsed, searchText };
      });

      racesSorted = tmp.sort((a, b) => String(b.date).localeCompare(String(a.date)));

      updateSelectedHorseUI();
      updateStarToggleUI();
      wireEvents();

      requestAnimationFrame(() => {
        renderList();
        showLoading(false);
      });
    }

    function wireEvents() {
      document.getElementById('toggleHorsePickerBtn')?.addEventListener('click', () => {
        if (horsePickerOpen) closeHorsePicker();
        else openHorsePicker();
      });
      document.getElementById('closeHorsePickerBtn')?.addEventListener('click', closeHorsePicker);
      document.getElementById('horsePickerBackdrop')?.addEventListener('click', closeHorsePicker);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && horsePickerOpen) closeHorsePicker();
      });

      document.getElementById('starToggleBtn')?.addEventListener('click', () => {
        showStarOnly = !showStarOnly;
        updateStarToggleUI();
        scheduleRender(true);
      });

      document.getElementById('clearHorseBtn')?.addEventListener('click', clearHorseFilter);

      const si = document.getElementById('searchInput');
      if (si) {
        si.addEventListener('input', () => {
          if (isComposing) return;
          scheduleRender(false);
        });

        si.addEventListener('compositionstart', () => {
          isComposing = true;
        });

        si.addEventListener('compositionend', () => {
          isComposing = false;
          scheduleRender(false);
        });
      }

      document.getElementById('moreBtn')?.addEventListener('click', () => {
        displayLimit = (displayLimit === Infinity) ? Infinity : (displayLimit + MORE_STEP);
        renderList();
      });

      document.getElementById('allBtn')?.addEventListener('click', () => {
        displayLimit = Infinity;
        renderList();
      });

      document.getElementById('scrollTopBtn')?.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      window.addEventListener('scroll', () => {
        const btn = document.getElementById('scrollTopBtn');
        if (!btn) return;
        btn.classList.toggle('hidden', !(window.scrollY > 600));
      }, { passive: true });
    }

    loadData();
  </script>

  <footer id="appFooter" class="fixed inset-x-0 bottom-0 z-50 bg-white/90 backdrop-blur-md border-t border-slate-200 pb-safe">
    <div class="max-w-4xl mx-auto px-4 md:px-8 py-3">
      <div class="flex items-center gap-3 w-full">

        <div class="relative flex-1 group">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs transition-colors group-focus-within:text-indigo-500"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="検索 (レース名など)"
            class="w-full bg-slate-100 border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-indigo-500 placeholder-slate-400 transition-all shadow-inner"
            autocomplete="off"
          />
        </div>

        <button
          id="starToggleBtn"
          class="btn-icon bg-white border border-slate-200 text-slate-400 hover:text-slate-600 hover:border-slate-300 shadow-sm"
          type="button"
          title="お気に入りのみ"
        >
          <i id="starToggleIcon" class="far fa-star"></i>
        </button>

        <button
          id="toggleHorsePickerBtn"
          class="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-600 font-bold hover:border-slate-300 hover:text-slate-800 transition-all shadow-sm flex items-center gap-2 whitespace-nowrap"
          type="button"
          title="馬を選ぶ"
        >
          <i class="fas fa-horse"></i>
          <span id="horsePickerLabel">馬を選択</span>
          <i id="horsePickerChevron" class="fas fa-chevron-up text-[10px] text-slate-400"></i>
        </button>

        <div id="selectedHorseBadge" class="hidden items-center whitespace-nowrap bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-100 text-xs font-bold">
          <span id="selectedHorseName"></span>
          <button
            id="clearHorseBtn"
            class="ml-2 w-4 h-4 flex items-center justify-center rounded-full hover:bg-indigo-200 text-indigo-400 hover:text-indigo-800 transition-colors hidden"
            type="button"
          >
            <i class="fas fa-xmark text-[10px]"></i>
          </button>
        </div>

      </div>
    </div>
  </footer>

  <style>
    /* Safe Area for iPhone X+ */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>

</body>
